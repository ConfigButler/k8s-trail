apiVersion: configbutler.ai/v1alpha3
kind: GitTarget
metadata:
  name: coffee
  namespace: voter
spec:
  branch: coffee-change
  clusterProviderRef:
    name: default
  commit:
    message:
      liveTemplate: |-
        chore(coffee): {{.Count}} change{{if ne .Count 1}}s{{end}}

        {{range .Resources -}}
        - [{{.Operation}}] {{if .Kind}}{{.Kind}}{{else}}{{.Resource}}{{end}}/{{.Name}}{{with .ResourceVersion}}@{{.}}{{end}}
        {{end -}}
      reconcileTemplate: 'chore(coffee): reconcile {{.Count}} {{if .Resource}}{{.Resource}}{{else}}resources{{end}}{{with .ResourceVersion}} at rv {{.}}{{end}}'
    window: 5s
  gitProviderRef:
    name: k8s-trail
  onRefusal: Ignore
  path: configs
  placement:
    byType:
      examples.configbutler.ai/v1alpha1/coffeeconfigs: coffeeconfig.yaml
      v1/secrets: secrets/{namespace}/{name}{sensitiveSuffix}
    default: '{name}.yaml'
  prune:
    mode: Always
  serializeNamespace: false
