apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: room-pass
rules:
  - apiGroups:
      - room-pass.koudijs.dev
    resources:
      - rooms
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - room-pass.koudijs.dev
    resources:
      - rooms/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - room-pass.koudijs.dev
    resources:
      - participants
    verbs:
      - get
      - list
      - create
  - apiGroups:
      - ""
    resourceNames:
      - room-pass-cookie
    resources:
      - secrets
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: voter
rules:
  - apiGroups:
      - examples.configbutler.ai
    resourceNames:
      - demo-coffee
    resources:
      - coffeeconfigs
    verbs:
      - get
  - apiGroups:
      - examples.configbutler.ai
    resources:
      - quizsessions
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - examples.configbutler.ai
    resources:
      - quizsubmissions
    verbs:
      - list
      - watch
  - apiGroups:
      - examples.configbutler.ai
    resources:
      - quizsessions/status
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: voter-audience
rules:
  - apiGroups:
      - examples.configbutler.ai
    resources:
      - coffeeconfigs
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - configbutler.ai
    resources:
      - commitrequests
    verbs:
      - create
      - get
      - list
      - watch
  - apiGroups:
      - examples.configbutler.ai
    resources:
      - quizsessions
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - examples.configbutler.ai
    resources:
      - quizsubmissions
    verbs:
      - get
  - apiGroups:
      - platform.configbutler.ai
    resources:
      - databases
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: voter-audience-coffee-admin
rules:
  - apiGroups:
      - examples.configbutler.ai
    resources:
      - coffeeconfigs
    verbs:
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: room-pass
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: room-pass
subjects:
  - kind: ServiceAccount
    name: room-pass
    namespace: voter
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: voter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: voter
subjects:
  - kind: ServiceAccount
    name: voter
    namespace: voter
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: voter-audience
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: voter-audience
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: demo:voter-audience
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: voter-audience-ballot
rules:
  - apiGroups:
      - examples.configbutler.ai
    resources:
      - quizsubmissions
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
    voter.configbutler.ai/description: Created live from the operator page. Not a Flux resource; gitops-reverser mirrors it to the audit trail.
  labels:
    app.kubernetes.io/managed-by: voter
    voter.configbutler.ai/grant: ballot
  name: voter-audience-ballot-frontend-vue
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: voter-audience-ballot
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: demo:frontend-vue
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
    voter.configbutler.ai/description: Created live from the operator page. Not a Flux resource; gitops-reverser mirrors it to the audit trail.
  labels:
    app.kubernetes.io/managed-by: voter
    voter.configbutler.ai/grant: ballot
  name: voter-audience-ballot-voter-audience
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: voter-audience-ballot
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: demo:voter-audience
