apiVersion: examples.configbutler.ai/v1alpha1
kind: QuizSession
metadata:
  name: round-1
  annotations:
    voter.configbutler.ai/ballot-groups: demo:frontend-vue
spec:
  questions:
    - choices:
        - Yes, every day
        - Once, it scared me
        - What's kubectl?
      id: kubectl
      required: true
      title: Have you ever typed kubectl?
      type: singleChoice
    - choices:
        - What is KubeCon?
        - "1.000"
        - "5.000"
        - "10.000"
        - "15.000"
      id: kubecon
      required: true
      title: How many people visit KubeCon?
      type: singleChoice
    - choices:
        - "Yes, cool!"
        - Yes, but too big
        - "No"
      id: cncf
      required: true
      title: Do you know CNCF?
      type: singleChoice
  state: closed
  title: Warm-up
---
apiVersion: examples.configbutler.ai/v1alpha1
kind: QuizSession
metadata:
  name: round-2
  annotations:
    voter.configbutler.ai/ballot-groups: demo:frontend-vue
spec:
  questions:
    - choices:
        - React
        - Vue
        - Angular
        - Whatever comes out next week
      id: framework
      required: true
      title: Which frontend framework will still be around in 10 years?
      type: singleChoice
    - choices:
        - Frontender
        - Backender
        - Full-stack
        - Lost DevOps guy
        - "No"
      id: role
      required: true
      title: What fits you best?
      type: singleChoice
    - choices:
        - Never
        - 1–3 times
        - I've stopped counting
      id: diy
      required: true
      title: How many times have you built login, permissions and validation yourself?
      type: singleChoice
    - choices:
        - Last write wins
        - First write wins, the second one sees a conflict
        - Merge it somehow
        - Panic
      id: conflict
      required: true
      title: What should happen when two people save the same setting at once?
      type: singleChoice
  state: live
  title: Building the frontend
