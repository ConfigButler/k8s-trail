        - Weird
        - Brilliant
        - Dangerous
        - All of the above
      id: bff
      required: true
      title: 'Kubernetes as your BFF: weird, brilliant or dangerous?'
      type: singleChoice
  state: closed
  title: Coffee, and the verdict
