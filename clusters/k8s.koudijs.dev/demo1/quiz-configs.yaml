apiVersion: examples.configbutler.ai/v1alpha1
kind: QuizSession
metadata:
  name: round-1
spec:
  questions:
    - choices:
        - Yes, every day
        - Once, it scared me
        - What's kubectl?
      id: kubectl
      required: true
      title: Have you ever typed kubectl?
      type: singleChoice
  state: live
  title: Warm-up
---
apiVersion: examples.configbutler.ai/v1alpha1
kind: QuizSession
metadata:
  name: round-2
spec:
  questions:
    - choices:
        - React
        - Vue
        - Angular
        - Whatever comes out next week
      id: framework
      required: true
      title: Which frontend framework will still be around in 10 years?
      type: singleChoice
    - choices:
        - Never
        - 1–3 times
        - I've stopped counting
      id: diy
      required: true
      title: How many times have you built login, permissions and validation yourself?
      type: singleChoice
    - choices:
        - Last write wins
        - First write wins, the second one sees a conflict
        - Merge it somehow
        - Panic
      id: conflict
      required: true
      title: What should happen when two people save the same setting at once?
      type: singleChoice
  state: live
  title: Building the frontend
---
apiVersion: examples.configbutler.ai/v1alpha1
kind: QuizSession
metadata:
  name: round-3
spec:
  questions:
    - choices:
        - Live, I trust everyone
        - Reviewed first
        - Only the owner may change it
      id: cappuccino
      required: true
      title: 'Changing the price of a cappuccino: live, or reviewed first?'
      type: singleChoice
    - choices:
        - Weird
        - Brilliant
        - Dangerous
        - All of the above
      id: bff
      required: true
      title: 'Kubernetes as your BFF: weird, brilliant or dangerous?'
      type: singleChoice
  state: live
  title: Coffee, and the verdict
