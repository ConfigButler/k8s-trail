apiVersion: examples.configbutler.ai/v1alpha1
kind: QuizSession
metadata:
  annotations:
    voter.configbutler.ai/ballot-groups: demo:frontend-vue,demo:voter-audience
  name: round-2
spec:
  questions:
    - choices:
        - React
        - Vue
        - Angular
        - Whatever comes out next week
      id: framework
      required: true
      title: Which frontend framework will still be around in 10 years?
      type: singleChoice
    - choices:
        - Frontender
        - Backender
        - Full-stack
        - Lost DevOps guy
        - "No"
      id: role
      required: true
      title: What fits you best?
      type: singleChoice
    - choices:
        - Never
        - 1–3 times
        - I've stopped counting
      id: diy
      required: true
      title: How many times have you built login, permissions and validation yourself?
      type: singleChoice
    - choices:
        - Last write wins
        - First write wins, the second one sees a conflict
        - Merge it somehow
        - Panic
      id: conflict
      required: true
      title: What should happen when two people save the same setting at once?
      type: singleChoice
  state: closed
  title: Building the frontend
