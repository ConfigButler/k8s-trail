apiVersion: configbutler.ai/v1alpha3
kind: WatchRule
metadata:
  name: coffee
  namespace: voter
spec:
  gitTargetRef:
    name: coffee
  rules:
    - apiGroups:
        - examples.configbutler.ai
      apiVersions:
        - v1alpha1
      resources:
        - coffeeconfigs
---
apiVersion: configbutler.ai/v1alpha3
kind: GitTarget
metadata:
  name: coffee
  namespace: voter
spec:
  allowedCommitRequests:
    - consumerNamespaces:
        from: Same
  commit:
    message:
      liveTemplate: |-
        chore(coffee): {{.Count}} change{{if ne .Count 1}}s{{end}}

        {{range .Resources -}}
        - [{{.Operation}}] {{if .Kind}}{{.Kind}}{{else}}{{.Resource}}{{end}}/{{.Name}}{{with .ResourceVersion}}@{{.}}{{end}}
        {{end -}}
      reconcileTemplate: 'chore(coffee): reconcile {{.Count}} {{if .Resource}}{{.Resource}}{{else}}resources{{end}}{{with .ResourceVersion}} at rv {{.}}{{end}}'
    window:
      idleTimeout: 5s
      maxDuration: 1m
  gitBranchRef:
    name: coffee-change
  kubeProviderRef:
    name: local
  onRefusal: Ignore
  path: configs/coffee
  placement:
    byType:
      examples.configbutler.ai/v1alpha1/coffeeconfigs: coffeeconfig.yaml
      v1/secrets: secrets/{namespace}/{name}{sensitiveSuffix}
    default: '{name}.yaml'
  prune:
    mode: Always
  serializeNamespace: false
