apiVersion: configbutler.ai/v1alpha3
kind: WatchRule
metadata:
  name: seats
  namespace: voter
spec:
  gitTargetRef:
    name: seats
  rules:
    - apiGroups:
        - examples.configbutler.ai
      apiVersions:
        - v1alpha1
      resources:
        - seats
        - seatingplans
---
apiVersion: configbutler.ai/v1alpha3
kind: GitTarget
metadata:
  name: seats
  namespace: voter
spec:
  allowedCommitRequests:
    - consumerNamespaces:
        from: Same
  commit:
    message:
      liveTemplate: |-
        chore(seats): {{.Count}} change{{if ne .Count 1}}s{{end}}

        {{range .Resources -}}
        - [{{.Operation}}] {{if .Kind}}{{.Kind}}{{else}}{{.Resource}}{{end}}/{{.Name}}{{with .ResourceVersion}}@{{.}}{{end}}
        {{end -}}
      reconcileTemplate: 'chore(seats): reconcile {{.Count}} {{if .Resource}}{{.Resource}}{{else}}resources{{end}}{{with .ResourceVersion}} at rv {{.}}{{end}}'
    window:
      idleTimeout: 5s
      maxDuration: 1m
  gitBranchRef:
    name: main
  kubeProviderRef:
    name: local
  onRefusal: Ignore
  path: seats
  placement:
    byType:
      examples.configbutler.ai/v1alpha1/seatingplans: '{name}.yaml'
      examples.configbutler.ai/v1alpha1/seats: row-{label:voter.configbutler.ai/row}.yaml
      v1/secrets: secrets/{namespace}/{name}{sensitiveSuffix}
    default: '{name}.yaml'
  prune:
    mode: Always
  serializeNamespace: false
