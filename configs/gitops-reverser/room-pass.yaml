apiVersion: configbutler.ai/v1alpha3
kind: WatchRule
metadata:
  name: room-pass
  namespace: voter
spec:
  gitTargetRef:
    name: room-pass
  rules:
    - apiGroups:
        - room-pass.koudijs.dev
      apiVersions:
        - v1alpha1
      resources:
        - rooms
---
apiVersion: configbutler.ai/v1alpha3
kind: GitTarget
metadata:
  name: room-pass
  namespace: voter
spec:
  allowedCommitRequests:
    - consumerNamespaces:
        from: Same
  commit:
    message:
      liveTemplate: |-
        chore(room-pass): {{.Count}} change{{if ne .Count 1}}s{{end}}

        {{range .Resources -}}
        - [{{.Operation}}] {{if .Kind}}{{.Kind}}{{else}}{{.Resource}}{{end}}/{{.Name}}{{with .ResourceVersion}}@{{.}}{{end}}
        {{end -}}
      reconcileTemplate: 'chore(room-pass): reconcile {{.Count}} {{if .Resource}}{{.Resource}}{{else}}resources{{end}}{{with .ResourceVersion}} at rv {{.}}{{end}}'
    window:
      idleTimeout: 5s
      maxDuration: 1m
  gitBranchRef:
    name: main
  kubeProviderRef:
    name: local
  onRefusal: Ignore
  path: room-pass
  placement:
    byType:
      room-pass.koudijs.dev/v1alpha1/rooms: rooms.yaml
      v1/secrets: secrets/{namespace}/{name}{sensitiveSuffix}
    default: '{name}.yaml'
  prune:
    mode: Always
  serializeNamespace: false
