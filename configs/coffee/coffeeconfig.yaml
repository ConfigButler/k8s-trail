apiVersion: examples.configbutler.ai/v1alpha1
kind: CoffeeConfig
metadata:
  name: demo-coffee
spec:
  bannerText: "My little example to show what I mean by settings injection"
  currency: 'EUR'
  products:
    - description: "Tea"
      enabled: true
      name: Tea
      priceCents: 395
      sku: coffee-filter
    - description: A very nice cop of ☕
      enabled: true
      name: Cappucino
      priceCents: 504
      sku: cappucino
    - description: A very small but strong thingy
      enabled: true
      name: Espresso
      priceCents: 349
      sku: espresso
  shopName: "Dont do this on stage!"
  vouchers: []
  mail:
    apiKeySecretRef:
      key: apiKey
      name: coffee-mail
    provider: sendgrid
  payments:
    apiKeySecretRef:
      key: apiKey
      name: coffee-payments
    zeroAmountCheckoutAllowed: true
    provider: stripe
