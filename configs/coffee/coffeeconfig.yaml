apiVersion: examples.configbutler.ai/v1alpha1
kind: CoffeeConfig
metadata:
  name: demo-coffee
spec:
  bannerText: "My little example to show what I mean by settings injection"
  currency: 'EUR'
  products:
    - description: "A very nice cop of ☕"
      enabled: true
      name: Cappucinooo
      priceCents: 900
      sku: cappucino
    - description: Tea
      enabled: true
      name: Tea
      priceCents: 39
      sku: coffee-filter
  shopName: "Coffee ordering demo!"
  vouchers: [{appliesToProducts: [coffee-filter], code: voucher-1, discountType: percentage, discountValue: 100, displayMessage: "", enabled: true, maximumUsage: 5}]
  mail:
    apiKeySecretRef:
      key: apiKey
      name: coffee-mail
    provider: sendgrid
  payments:
    apiKeySecretRef:
      key: apiKey
      name: coffee-payments
    zeroAmountCheckoutAllowed: true
    provider: stripe
