apiVersion: examples.configbutler.ai/v1alpha1
kind: CoffeeConfig
metadata:
  name: demo-coffee
spec:
  bannerText: "My little example to show what I mean by settings injection"
  currency: 'SEk'
  products:
    - description: "A very nice cop of ☕"
      enabled: false
      name: Cappucinooo
      priceCents: 504
      sku: cappucino
    - description: Tea
      enabled: true
      name: Tea
      priceCents: 39
      sku: coffee-filter
  shopName: "NICE TALK!!"
  vouchers: []
  mail:
    apiKeySecretRef:
      key: apiKey
      name: coffee-mail
    provider: sendgrid
  payments:
    apiKeySecretRef:
      key: apiKey
      name: coffee-payments
    zeroAmountCheckoutAllowed: true
    provider: stripe
