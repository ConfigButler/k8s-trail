apiVersion: examples.configbutler.ai/v1alpha1
kind: CoffeeConfig
metadata:
  name: demo-coffee
spec:
  bannerText: "Edit this menu. Every phone in the room sees your change."
  currency: 'EUR'
  products:
    - description: "Double shot with silky milk"
      enabled: true
      name: Flat White
      priceCents: 397
      sku: coffee-flat-white
    - description: Small, strong, and fast
      enabled: true
      name: Espresso
      priceCents: 275
      sku: coffee-espresso
    - description: Batch brew for fast queues
      enabled: true
      name: Filter Coffee
      priceCents: 250
      sku: coffee-filter
  shopName: Koudijs Demo Coffee2
  vouchers: [{code: TESTNET, discountType: percentage, discountValue: 100, displayMessage: TestNet coffee is on us, enabled: true, maximumUsage: 3}]
