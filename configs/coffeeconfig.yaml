apiVersion: examples.configbutler.ai/v1alpha1
kind: CoffeeConfig
metadata:
  name: demo-coffee
spec:
  bannerText: "Edit this menu. Every phone in the room sees your change."
  currency: 'EUR'
  products:
    - description: "Double shot with silky milk"
      enabled: true
      name: Flat White
      priceCents: 396
      sku: coffee-flat-white
    - description: Small, strong, and fast
      enabled: true
      name: Espresso
      priceCents: 275
      sku: coffee-espresso
    - description: Batch brew for fast queues
      enabled: true
      name: Filter Coffee
      priceCents: 250
      sku: coffee-filter
  shopName: 'Frontmania hounted Coffee1'
  vouchers: [{code: FRONTMANIA, discountType: percentage, discountValue: 10, displayMessage: Wow you actually tried this, enabled: true, maximumUsage: 20, appliesToProducts: []}]
  payments:
    zeroAmountCheckoutAllowed: true
