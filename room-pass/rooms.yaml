apiVersion: room-pass.koudijs.dev/v1alpha1
kind: Room
metadata:
  name: mission2
spec:
  allowedReturnURLs:
    - https://demo.koudijs.dev/
  appearance:
    tagline: Dutch Cloud Native Day · Mission 2
    picture: /dcnd-2026/images/mission2-simon.jpg
